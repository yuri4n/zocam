# agent: claude — release workflow for zocam. Rewritten 2026-08-09:
# a release is a GitHub Release now, not a bare tag.
#
# Draft it in the browser: Releases → Draft a new release → create the
# tag vX.Y.Z there → write the notes → Publish. That click is the
# trigger; this job is the gate behind it. It checks that the tag
# equals the version in mix.exs, runs the tests, and publishes the
# package to Hex.pm. `mix hex.publish` also builds the ExDoc pages and
# uploads them to hexdocs.pm/zocam.
#
# If the run fails, the Release exists but nothing was published:
# delete the Release and the tag, fix, and release again.
#
# The same shape exists in s7r's release.yml, which publishes nothing
# because s7r is consumed from the tag itself. Keep the two workflows
# telling the same story.
#
# Auth: the HEX_API_KEY repository secret. Hex 2.x has no CLI command for
# key creation, and the API rejects key creation with token auth. Create
# the key in the browser: https://hex.pm/dashboard/keys — name it
# gh-actions, give it the api:write permission — then store it with:
#   gh secret set HEX_API_KEY
name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.2"

      - run: mix deps.get

      # Guard: the tag must match the version in mix.exs. A mismatch
      # stops the release before anything is published.
      - name: Check that the tag matches mix.exs
        run: |
          MIX_VERSION="$(mix eval 'IO.puts(Mix.Project.config()[:version])' | tail -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MIX_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match mix.exs version $MIX_VERSION" >&2
            exit 1
          fi

      - run: mix test

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
