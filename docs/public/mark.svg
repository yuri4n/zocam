<!-- agent: claude — whole file.
  The zocam mark alone, hero size: the animated orbit-garden tile from
  logo-dark.svg without the wordmark. The landing hero shows it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="The zocam mark">
  <style>
    .spin-a { animation: spin 22s linear infinite; transform-origin: 24px 24px; }
    .spin-b { animation: spin 14s linear infinite reverse; transform-origin: 24px 24px; }
    .spin-c { animation: spin 9s linear infinite; transform-origin: 24px 24px; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: 24px 24px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { transform: scale(0.55); opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) {
      .spin-a, .spin-b, .spin-c, .pulse { animation: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="47" height="47" rx="10" fill="#050605" stroke="#1d231e"/>
  <g style="filter: drop-shadow(0 0 2.5px rgba(61,220,132,0.85));">
    <g class="spin-a">
      <circle cx="24" cy="24" r="17" fill="none" stroke="#3ddc84" stroke-width="1.6" stroke-dasharray="3 5" stroke-linecap="round"/>
      <circle cx="41" cy="24" r="1.8" fill="#fbbf24"/>
    </g>
    <g class="spin-b">
      <circle cx="24" cy="24" r="11.5" fill="none" stroke="#2dd4bf" stroke-width="1.6" stroke-dasharray="11 7" stroke-linecap="round"/>
      <circle cx="24" cy="12.5" r="1.6" fill="#a3e635"/>
    </g>
    <g class="spin-c">
      <circle cx="24" cy="24" r="6.5" fill="none" stroke="#a3e635" stroke-width="1.5" stroke-dasharray="2 3.4" stroke-linecap="round"/>
    </g>
    <circle class="pulse" cx="24" cy="24" r="2.7" fill="#3ddc84"/>
  </g>
  <g stroke="#3ddc84" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round">
    <path d="M24 3.5v3"/><path d="M24 41.5v3"/><path d="M3.5 24h3"/><path d="M41.5 24h3"/>
  </g>
</svg>
